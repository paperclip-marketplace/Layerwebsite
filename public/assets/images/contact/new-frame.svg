<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1440 409"
  fill="none"
  preserveAspectRatio="none"
>
  <!--
    Contact Us bottom glow. Edit stop-color values below to retune.
    Spectrum is mirrored end-to-end so L→R tiling flows seamlessly.
  -->
  <defs>
    <linearGradient id="contactGlowH" x1="0" y1="0" x2="1440" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d7d97f" />
      <stop offset="8%" stop-color="#dbce5e" />
      <stop offset="16%" stop-color="#e8bd44" />
      <stop offset="24%" stop-color="#f4b339" />
      <stop offset="32%" stop-color="#f8a836" />
      <stop offset="40%" stop-color="#f99d39" />
      <stop offset="48%" stop-color="#f5943f" />
      <stop offset="50%" stop-color="#e97e4c" />
      <stop offset="52%" stop-color="#e47256" />
      <stop offset="60%" stop-color="#e16865" />
      <stop offset="68%" stop-color="#dc657b" />
      <stop offset="76%" stop-color="#dd779e" />
      <stop offset="84%" stop-color="#e16865" />
      <stop offset="92%" stop-color="#e97e4c" />
      <stop offset="100%" stop-color="#d7d97f" />
    </linearGradient>
    <linearGradient id="contactGlowFade" x1="0" y1="0" x2="0" y2="409" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff" stop-opacity="1" />
      <stop offset="55%" stop-color="#fff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <mask id="contactGlowMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1440" height="409">
      <rect width="1440" height="409" fill="url(#contactGlowFade)" />
    </mask>
  </defs>
  <ellipse
    cx="720"
    cy="120"
    rx="900"
    ry="180"
    fill="url(#contactGlowH)"
    mask="url(#contactGlowMask)"
  />
</svg>
